# netwatch configuration (ASCII only). Check with: netwatch --check-config

[general]
interval_secs = 15        # time between check rounds
fail_window_secs = 120    # SMS only if a check failed during this whole time
check_timeout_secs = 5

# Every [[check]] takes one target or a list; each target is monitored and
# alerted on separately (name in the SMS = "<name> <target>").

# --- DNS: several resolvers, each must answer an A query -------------------
[[check]]
name = "dns"
kind = "dns"
servers = ["192.0.2.53", "192.0.2.54", "198.51.100.53:53"]
query = "example.com"

# --- SMTP: several servers ("host" or "host:port"; default port below) ------
[[check]]
name = "smtp"
kind = "smtp"
hosts = ["mx1.example.com", "mx2.example.com", "relay.example.com:587"]
port = 25
ehlo = "monitor.example.com"

# --- HTTP/HTTPS: status (default 2xx/3xx, no redirect following) -----------
[[check]]
name = "web"
kind = "http"
urls = ["https://www.example.com/", "http://intranet.example.com/"]

[[check]]
name = "api"
kind = "http"
url = "https://api.example.com/health"
expect_status = [200]
contains = '"status":"ok"'   # optional text that must be in the body

[sms]
url = "https://api.example.com/v1/sms"
recipients = ["+41790000000"]
# Token is sent as "Authorization: Bearer <token>".
token_file = "/etc/netwatch/sms.token"
# body_format: "json" or "form"; {to} and {message} are escaped automatically.
body_format = "json"
body_template = '{"to":"{to}","message":"{message}"}'
timeout_secs = 15
repeat_secs = 0           # 0 = one SMS per outage, else repeat every N seconds
notify_recovery = true

# Additional HTTP headers, if your provider needs them:
# [sms.headers]
# X-Api-Version = "2"
